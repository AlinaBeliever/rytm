<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ритм</title>
  <meta name="description" content="Ритм — завдання й звички в одному спокійному додатку. Працює без інтернету.">
  <meta name="theme-color" content="#f6f6f3">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ритм">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    // Тема застосовується до першого малювання, щоб не було «спалаху»
    try {
      var t = (JSON.parse(localStorage.getItem('rytm.ui')) || {}).theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Перейти до змісту</a>
  <div class="app">
    <nav class="nav" aria-label="Головне меню">
      <div class="brand" aria-hidden="true"><img src="icons/icon-192.png" alt="" width="28" height="28"><span>Ритм</span></div>
      <a class="nav-link" data-nav="today" href="#/today">
        <svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.6" fill="currentColor" stroke="none"/></svg>
        <span>Сьогодні</span></a>
      <a class="nav-link" data-nav="week" href="#/week">
        <svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/></svg>
        <span>Тиждень</span></a>
      <a class="nav-link" data-nav="habits" href="#/habits">
        <svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21c4 0 7-2.8 7-6.8 0-3.2-2-5.2-3.5-7.2-.5 2-1.6 3-2.6 3.2C13.4 7 12 4.5 9.5 3c.3 3-1.3 4.8-2.7 6.5C5.6 11 5 12.5 5 14.2 5 18.2 8 21 12 21z"/></svg>
        <span>Звички</span></a>
      <a class="nav-link" data-nav="progress" href="#/progress">
        <svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>
        <span>Прогрес</span></a>
      <a class="nav-link" data-nav="settings" href="#/settings">
        <svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>
        <span>Налаштування</span></a>
    </nav>
    <main id="main" tabindex="-1">
      <div id="shell-banner" class="banner shell-banner" hidden></div>
      <div id="view" aria-live="off"></div>
    </main>
  </div>
  <button type="button" class="fab" id="fab" aria-label="Нове завдання" hidden>
    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <noscript><p style="padding:24px">Для роботи «Ритму» потрібен JavaScript.</p></noscript>
</body>
</html>
