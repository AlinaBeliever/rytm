# Netlify: публікуємо корінь проєкту як є (збирання не потрібне)
[build]
  publish = "."
  command = ""

# Service worker і маніфест завжди свіжі — інакше оновлення не дійдуть до користувачів
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Тести не потрібні на сайті
[[redirects]]
  from = "/tests/*"
  to = "/index.html"
  status = 404
  force = true
